# 客户端系统 Nginx 配置
# 将此文件复制到 /etc/nginx/conf.d/client-system.conf

# 如果需要在 /client/ 路径下提供服务
server {
    listen 80;
    listen 443 ssl http2;
    server_name qwquant.com www.qwquant.com;

    # SSL证书配置（如需使用HTTPS）
    ssl_certificate /etc/letsencrypt/live/qwquant.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qwquant.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 客户端系统 - 访问 /client/ 时提供服务
    location /client/ {
        alias /app/client-system/dist/;

        # 配置SPA路由 - 所有非文件请求转发到index.html
        try_files $uri $uri/ /client/index.html;

        # 设置缓存策略
        # HTML文件不缓存
        location ~ /client/.*\.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # 静态资源使用长期缓存
        location ~ \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # 如果需要在根路径直接访问客户端系统，注释掉上面的 location /client/
    # 并使用以下配置：
    # location / {
    #     root /app/client-system/dist;
    #     try_files $uri $uri/ /index.html;
    #
    #     # HTML文件不缓存
    #     location ~ \.html$ {
    #         add_header Cache-Control "no-cache, no-store, must-revalidate";
    #     }
    #
    #     # 静态资源使用长期缓存
    #     location ~ \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    #         expires 1y;
    #         add_header Cache-Control "public, immutable";
    #     }
    # }

    # 其他现有的location配置保持不变...
    # 例如 API代理等

    # 日志配置
    access_log /var/log/nginx/client-system-access.log;
    error_log /var/log/nginx/client-system-error.log;
}

# HTTP重定向到HTTPS（可选）
server {
    listen 80;
    server_name qwquant.com www.qwquant.com;

    # 排除Let's Encrypt验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # 其他请求重定向到HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}
